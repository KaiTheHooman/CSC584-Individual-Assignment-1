<html>
    <head>
        <title>Home</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <style>
            body {
                background-color: lightcoral;
                font-family: Arial, sans-serif;
                margin: 40px;
            }
            label {
                display: block;
                margin-bottom: 10px;
            }
            
            input, textarea {
                display: block;
                border-radius: 8px;
                margin-bottom: 10px;
            }
            
            form {
                margin: 40px auto;
                background-color: white;
                max-width: 450px;
                margin: 0, auto;
                border-radius: 8px;
                padding: 10px;
            }
            
            button[type="submit"], input[type="submit"] {
                width: 100%;
                height: 30px;
                border: lightblue;
                border-radius: 20px;
                background-color: blue;
                text-align: center;
                color: #ffffff;
                font-weight: bold;
            }
            
            button[type="submit"]:hover, input[type="submit"]:hover{
                background-color: lightskyblue;
            }
        </style>
    </head>
    <body>
        <form action="ProfileServlet" method="post">
            <div>
                <label>Name:</label>
                <input type="text" name="fullName" required>
            </div>

            <div>
                <label>Student ID:</label>
                <input type="text" name="studentId" required>
            </div>

            <div>
                <label>Programme:</label>
                <input type="text" name="programme" required>
            </div>

            <div>
                <label>Email:</label>
                <input type="email" name="email" required>
            </div>

            <div>
                <label>Hobbies:</label>
                <input type="text" name="hobbies" required>
            </div>

            <div>
                <label>Short Self-Introduction:</label>
                <textarea name="intro" rows="4" cols="40" required></textarea>
            </div>

            <button type="submit">Submit profile</button>
        </form>
        
    </body>
    
</html>
